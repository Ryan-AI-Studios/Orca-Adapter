[workspace]
resolver = "2"
members = [
    "crates/wondermaker_3mf_core",
    "crates/wondermaker_3mf_cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
wondermaker_3mf_core = { path = "crates/wondermaker_3mf_core" }
zip = "8.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
quick-xml = "0.41"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
camino = "1.2"
