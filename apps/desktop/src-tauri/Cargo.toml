[package]
name = "desktop"
version = "0.1.0"
description = "3MF Profile Transplant — Tauri 2 desktop shell"
authors = ["Wondermaker"]
edition = "2024"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wondermaker_3mf_core = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
camino = "1.2"

[dev-dependencies]
tempfile = "3"
